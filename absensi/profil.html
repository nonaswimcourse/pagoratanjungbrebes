<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profil Peserta</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --primary:#1666d9;
    --primary-dark:#0f2f8c;
    --accent:#f7a823;
    --bg:#eef2f9;
    --surface:#ffffff;
    --text:#172033;
    --muted:#697386;
    --border:#e3e8f0;
    --danger:#e0363f;
    --danger-bg:#ffe1e1;
    --radius-lg:20px;
    --radius-md:14px;
    --shadow-md:0 8px 24px -8px rgba(15,30,70,.18);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
    background:
      radial-gradient(1200px 600px at 100% -10%, rgba(22,102,217,.10), transparent 60%),
      radial-gradient(900px 500px at -10% 0%, rgba(247,168,35,.12), transparent 55%),
      var(--bg);
    color:var(--text);
  }
  .card{
    width:100%;
    max-width:380px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-md);
    padding:28px 24px 26px;
    text-align:center;
  }
  .foto-wrap{
    width:150px;height:190px;margin:0 auto 18px;border-radius:var(--radius-md);
    overflow:hidden;background:var(--bg);border:3px solid var(--surface);
    box-shadow:0 0 0 3px var(--primary);
    display:flex;align-items:center;justify-content:center;
  }
  .foto-wrap img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
  .foto-placeholder{font-size:46px;color:var(--muted)}
  .nama{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:0 0 4px}
  .sekolah{font-size:14.5px;color:var(--muted);margin:0 0 14px;font-weight:600}
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    background:#e8f6ec;color:#1f8b45;font-weight:700;font-size:13px;
    padding:7px 14px;border-radius:999px;
  }
  .badge.bad{background:var(--danger-bg);color:var(--danger)}
  .state{padding:36px 0;color:var(--muted);font-size:14.5px}
  .spinner{
    width:28px;height:28px;margin:0 auto 12px;border-radius:50%;
    border:3px solid var(--border);border-top-color:var(--primary);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  footer{margin-top:18px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<div class="card" id="card">
  <div class="state" id="state">
    <div class="spinner"></div>
    Memuat data peserta...
  </div>
</div>

<script type="module">
  import { SUPABASE_URL, SUPABASE_ANON_KEY } from "./config.js";

  const cardEl = document.getElementById("card");

  function renderError(msg) {
    cardEl.innerHTML = `
      <div class="state">
        <div class="foto-placeholder">⚠️</div>
        <p style="margin-top:10px">${msg}</p>
      </div>`;
  }

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function renderPeserta(p) {
    const fotoHtml = p.foto
      ? `<img src="${esc(p.foto)}" alt="Foto ${esc(p.nama)}">`
      : `<div class="foto-placeholder">👤</div>`;
    cardEl.innerHTML = `
      <div class="foto-wrap">${fotoHtml}</div>
      <h1 class="nama">${esc(p.nama)}</h1>
      <p class="sekolah">${esc(p.asal_sekolah || "-")}</p>
      <span class="badge">✓ Peserta Terdaftar</span>
      <footer>Absensi QR</footer>
    `;
  }

  const kode = new URLSearchParams(window.location.search).get("kode");

  if (!SUPABASE_URL || !SUPABASE_ANON_KEY || SUPABASE_URL.includes("ISI_")) {
    renderError("Konfigurasi aplikasi belum lengkap.");
  } else if (!kode) {
    renderError("Kode QR tidak ditemukan pada tautan ini.");
  } else {
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    // Baca dari VIEW publik "peserta_publik" (bukan tabel "peserta" langsung),
    // supaya orang yang scan QR pakai kamera HP biasa cuma bisa lihat
    // foto/nama/sekolah saja -- bukan seluruh data di tabel peserta.
    const { data, error } = await db
      .from("peserta_publik")
      .select("nama, asal_sekolah, foto")
      .eq("kode_qr", kode)
      .maybeSingle();

    if (error) {
      renderError("Gagal memuat data. Coba lagi nanti.");
    } else if (!data) {
      cardEl.innerHTML = `
        <div class="state">
          <div class="foto-placeholder">✕</div>
          <p style="margin-top:10px">QR tidak dikenali / peserta tidak terdaftar.</p>
        </div>`;
    } else {
      renderPeserta(data);
    }
  }
</script>

</body>
</html>
